[build-system]
requires = ["setuptools>=68,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wgbs-impute"
version = "0.2.0"
description = "Reference-panel imputation for low-coverage CpG methylation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "threadpoolctl>=3.2,<4"]

[project.optional-dependencies]
ml = ["catboost>=1.2.8,<2"]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
wgbs-impute = "wgbs_impute.cli:main"
wgbs-impute-docker = "wgbs_impute.docker_entry:main"

[tool.setuptools]
packages = ["wgbs_impute"]
package-dir = {wgbs_impute = "."}

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
