name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[ml,dev]'
      - run: ruff check .
      - run: python -m build
      # Exercise the installed distribution from outside the source checkout.
      - run: cd "$RUNNER_TEMP" && python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - run: cd "$RUNNER_TEMP" && wgbs-impute --help && wgbs-impute-docker --demo --out "$RUNNER_TEMP/demo"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wgbs-impute:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=256m wgbs-impute:ci --demo --out /tmp/demo
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=256m --entrypoint python wgbs-impute:ci -m unittest discover -s /build/tests -v
